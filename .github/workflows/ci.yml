name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libwayland-dev \
            libvulkan-dev libssl-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release
        env:
          # 打 tag 时（如 v1.2.3）将 tag 作为版本号注入；
          # 普通分支/PR 构建时回退到 Cargo.toml 的默认版本。
          SERIAL_TOOL_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: serial-tool-windows
          path: target/release/serial-tool.exe

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: serial-tool-linux
          path: target/release/serial-tool

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: serial-tool-macos
          path: target/release/serial-tool
